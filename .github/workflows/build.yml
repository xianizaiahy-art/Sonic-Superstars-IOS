name: Sonic Superstars - iOS IPA (Experimental A14+)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 360

    steps:
      - name: Check out NXNative No-BC
        uses: actions/checkout@v4
        with:
          repository: mianmuhammadse/nxnative
          ref: no-bc
          path: nxnative

      - name: Check available disk space
        run: df -h /

      - name: Install build dependencies
        run: |
          set -euo pipefail
          xcodebuild -version
          brew update
          brew install python@3.12 xcodegen zstd glslang
          echo "$(brew --prefix python@3.12)/bin" >> "$GITHUB_PATH"

      - name: Install Python dependencies
        run: |
          set -euo pipefail
          python3.12 -m venv "$RUNNER_TEMP/nx-venv"
          "$RUNNER_TEMP/nx-venv/bin/python" -m pip install --upgrade pip
          "$RUNNER_TEMP/nx-venv/bin/python" -m pip install lz4 "capstone>=5,<6" fonttools nsz zbic backports.zstd

      # Supply your own legally obtained game dump and keys through private GitHub Actions secrets.
      # Do not use third-party file-sharing links for game files or keys.
      - name: Prepare Sonic Superstars game files
        env:
          BASE_URL: ${{ secrets.GAME_URL }}
          UPDATE_URL: ${{ secrets.UPDATE_URL }}
          KEYS_URL: ${{ secrets.KEYS_URL }}
        run: |
          set -euo pipefail
          GAME_DIR="$RUNNER_TEMP/sonic-superstars"
          mkdir -p "$GAME_DIR"

          for name in BASE_URL UPDATE_URL KEYS_URL; do
            test -n "${!name}" || {
              echo "Missing required secret: $name"
              exit 1
            }
          done

          # These URLs must point to files you own and are legally entitled to use.
          curl --fail --location --retry 3 "$BASE_URL" --output "$GAME_DIR/Sonic_Superstars_Base.nsp"
          curl --fail --location --retry 3 "$UPDATE_URL" --output "$GAME_DIR/Sonic_Superstars_Update.nsp"
          curl --fail --location --retry 3 "$KEYS_URL" --output "$RUNNER_TEMP/prod.keys"

          test -s "$GAME_DIR/Sonic_Superstars_Base.nsp"
          test -s "$GAME_DIR/Sonic_Superstars_Update.nsp"
          test -s "$RUNNER_TEMP/prod.keys"
          ls -lh "$GAME_DIR"

      - name: Build unsigned Sonic Superstars IPA
        working-directory: nxnative
        env:
          # Keep the no-BC texture path from the source workflow.
          # This does not by itself guarantee A14 compatibility.
          DM_NO_BC_ASTC: all
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/nx-venv/bin/python" scripts/build_ipa_from_nsp.py \
            "$RUNNER_TEMP/sonic-superstars" \
            -k "$RUNNER_TEMP/prod.keys" \
            --allow-other-metal \
            -o "$RUNNER_TEMP/Sonic-Superstars-unsigned.ipa"

      - name: Upload unsigned IPA and build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sonic-superstars-unsigned-ipa
          path: |
            ${{ runner.temp }}/Sonic-Superstars-unsigned.ipa
            ${{ runner.temp }}/sonic-superstars/*_build/logs/**
            ${{ runner.temp }}/sonic-superstars/*_build/profile/**
          if-no-files-found: warn
          retention-days: 7

      - name: Remove temporary keys
        if: always()
        run: rm -f "$RUNNER_TEMP/prod.keys"
